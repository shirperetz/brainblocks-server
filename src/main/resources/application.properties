spring.application.name=brainblocks

spring.datasource.url=jdbc:mysql://localhost:3306/brainblocks?serverTimezone=UTC
spring.datasource.username=root
# The real password lives in local.properties (not in git) or in BRAINBLOCKS_DB_PASSWORD.
spring.config.import=optional:file:./local.properties
spring.datasource.password=${BRAINBLOCKS_DB_PASSWORD:}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true