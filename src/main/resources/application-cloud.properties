# 2026-11-11 - the PUBLIC site (Render, profile "cloud"). Everything secret comes from the host's
# environment variables, never from git (this repo is public). PostgreSQL on Neon (free); 2026-11-14
# Shir: all her current data moves there once (tools.DataCopy). No local AI, no local voice (the browser
# reads aloud). Katrine is never involved and never public.

spring.config.import=
spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DATABASE_USER}
spring.datasource.password=${DATABASE_PASSWORD}
spring.datasource.hikari.maximum-pool-size=3
spring.datasource.hikari.minimum-idle=0
# 2026-11-14: close idle connections after a minute so the free database can sleep between uses
# (Neon's free plan counts the hours it is awake).
spring.datasource.hikari.idle-timeout=60000
spring.datasource.hikari.max-lifetime=600000
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

server.address=0.0.0.0
server.port=${PORT:8080}
server.error.include-message=always

# The site's public address (https://....onrender.com): CORS, and the admin's passkeys belong to it.
brainblocks.cors.extra-origins=${PUBLIC_ORIGIN:}
brainblocks.public-origin=${PUBLIC_ORIGIN:}
# The host's proxy puts the visitor's address in X-Forwarded-For.
brainblocks.trust-forwarded=true
# The site's own join code and admin username(s) - set on the host, changeable from the admin screen.
brainblocks.join-code=${JOIN_CODE:}
brainblocks.admin-usernames=${ADMIN_USERNAMES:}
# No local AI / voice in the cloud: "לא הבנתי" uses the explanations written in code.
brainblocks.ai.enabled=false
brainblocks.tts.url=
# 2026-11-14: one service serves both the pages (built into the image at /app/dist) and /api - one
# address, and one free service that stays inside the free hours when it never sleeps.
brainblocks.client-dist=${CLIENT_DIST:/app/dist/}

# 2026-11-14 (Shir: "the server must always be awake"): it calls its own public address every 10
# minutes (the host sets RENDER_EXTERNAL_URL by itself).
brainblocks.keep-awake-url=${KEEP_AWAKE_URL:${RENDER_EXTERNAL_URL:}}

# 2026-11-14 (Shir: "another password or my fingerprint"): the admin needs a second step after the
# password - a passkey on her device or a one-time backup code. The PC-only lock can't work here.
brainblocks.admin-network=off
brainblocks.admin-2fa=${ADMIN_2FA:on}
# No phone alerts from the cloud (they go through Katrine, who stays on Shir's PC only).
brainblocks.phone-alerts=off
# Game rooms are kept in a file between restarts (lost on a new deploy - deploys are made by hand, not in school hours).
brainblocks.rooms-file=${ROOMS_FILE:/tmp/rooms-snapshot.json}
